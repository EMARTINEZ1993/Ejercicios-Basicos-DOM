<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/icono.png" type="image-png"> 
</head>
<body>
    <header>
        <h1>Ejercicios Basicos JS</h1>
    </header>
    <nav>
        <h3>Operaciones Matematicas</h3>
    </nav>
    <form action="">
        <label for="">Ingrese un Numero: </label><br>
        <input id="n1" type="number"  >
        <label for="">Ingrese un Numero: </label><br>
        <input id="n2" type="number">
        <label for="">Resulado: </label><br>
        <input type="text" id="resultado1" disabled>
        <small id="resultado2"></small>
        <small id="resultado3"></small>
        <button type="button" onclick="sumar()">Sumar</button>
        <button type="button" onclick="dividir()">Dividir</button>
        <button type="button" onclick="restar()">Restar</button>
        <button type="button" onclick="multiplicar()">Multiplicar</button>
        <button type="reset" >Cancelar</button>
    </form>
</body>
</html>
<script>    
    function sumar(){
        let numero1=parseInt(document.getElementById("n1").value);
        let numero2=parseInt(document.getElementById("n2").value);
        document.getElementById("resultado1").value=numero1+numero2;
    }

    function dividir(){
        let numero1=parseInt(document.getElementById("n1").value);
        let numero2=parseInt(document.getElementById("n2").value);
        document.getElementById("resultado1").value=numero1/numero2;
    }

    function restar(){
        let numero1=parseInt(document.getElementById("n1").value);
        let numero2=parseInt(document.getElementById("n2").value);
        document.getElementById("resultado1").value=numero1-numero2;
    }

    function multiplicar(){
        let numero1=parseInt(document.getElementById("n1").value);
        let numero2=parseInt(document.getElementById("n2").value);
        document.getElementById("resultado1").value=numero1*numero2;
    }
</script>
